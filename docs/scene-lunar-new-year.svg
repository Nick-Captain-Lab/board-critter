<svg xmlns="http://www.w3.org/2000/svg" class="walk" viewBox="-30 -50 240 135" width="240" height="135"><style>@keyframes blink{0%,90%,100%{opacity:0}93%,97%{opacity:1}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}60%{transform:translateY(-16px)}}@keyframes legA{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes legB{0%,100%{transform:translateY(-5px)}50%{transform:translateY(0)}}@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.95)}}@keyframes z{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-18px)}}@keyframes fall{0%{transform:translate(0,0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(8px,130px);opacity:0}}@keyframes drift{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}50%{transform:translate(14px,65px) rotate(180deg)}90%{opacity:1}100%{transform:translate(-4px,130px) rotate(360deg);opacity:0}}@keyframes rain{0%{transform:translate(0,0)}100%{transform:translate(-6px,135px)}}@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(6px,-120px);opacity:0}}@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}@keyframes burst{0%{transform:scale(.1);opacity:0}15%{opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.15);opacity:0}}@keyframes heat{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-26px);opacity:0}}@keyframes drip{0%,60%{transform:translateY(0);opacity:0}70%{opacity:1}100%{transform:translateY(14px);opacity:0}}.lid{opacity:0;animation:blink 3.5s infinite}.bob .body{animation:bob .9s ease-in-out infinite}.walk .body{animation:bob .4s steps(2) infinite}.walk .la{animation:legA .4s steps(2) infinite}.walk .lb{animation:legB .4s steps(2) infinite}.jump .all{animation:hop .7s ease-in-out infinite}.sleep .body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.4s ease-in-out infinite}.sleep .z1{animation:z 2.4s infinite}.sleep .z2{animation:z 2.4s 1.2s infinite}.fall{animation:fall 5s linear infinite}.drift{animation:drift 7s linear infinite}.rain{animation:rain 1s linear infinite}.rise{animation:rise 6s linear infinite}.twinkle{animation:twinkle 2s ease-in-out infinite}.spin{animation:spin 12s linear infinite}.sway{animation:sway 2.4s ease-in-out infinite}.heat{animation:heat 1.8s ease-out infinite}.burst{animation:burst 1.8s ease-out infinite}.drip{animation:drip 2.2s ease-in infinite}</style><defs><clipPath id="frame"><rect x="-30" y="-50" width="240" height="135" rx="14"/></clipPath></defs><g clip-path="url(#frame)"><defs><linearGradient id="cnySky" gradientUnits="userSpaceOnUse" x1="0" y1="-50" x2="0" y2="70"><stop offset="0" stop-color="#FF1A2E"/><stop offset=".55" stop-color="#C8102E"/><stop offset="1" stop-color="#7A0A1E"/></linearGradient></defs><rect x="-30" y="-50" width="240" height="135" rx="14" fill="url(#cnySky)"/><rect x="-30" y="70" width="240" height="15" fill="#0000000d"/><rect x="-30" y="70" width="240" height="15" fill="#4A0E0E"/><g class="sway" style="transform-origin:-10px -50px"><g transform="translate(-10 -28) scale(1)"><line x1="0" y1="-14" x2="0" y2="-8" stroke="#8a5a2b" stroke-width="1"/><rect x="-4" y="-9" width="8" height="2" fill="#E3B341"/><ellipse cx="0" cy="0" rx="9" ry="8" fill="#F2C14E"/><rect x="-4" y="7" width="8" height="2" fill="#E3B341"/><line x1="0" y1="9" x2="0" y2="14" stroke="#E3B341" stroke-width="1.5"/></g></g><g class="sway" style="transform-origin:190px -50px;animation-delay:-.8s"><g transform="translate(190 -28) scale(1)"><line x1="0" y1="-14" x2="0" y2="-8" stroke="#8a5a2b" stroke-width="1"/><rect x="-4" y="-9" width="8" height="2" fill="#E3B341"/><ellipse cx="0" cy="0" rx="9" ry="8" fill="#F2C14E"/><rect x="-4" y="