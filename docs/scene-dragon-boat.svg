<svg xmlns="http://www.w3.org/2000/svg" class="walk" viewBox="-54 -50 240 165" width="240" height="165"><style>@keyframes blink{0%,88%,100%{transform:scaleY(0)}90.5%{transform:scaleY(.8)}92.5%,94.5%{transform:scaleY(1)}96.5%{transform:scaleY(.8)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}60%{transform:translateY(-16px)}}@keyframes legA{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes legB{0%,100%{transform:translateY(-5px)}50%{transform:translateY(0)}}@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.95)}}@keyframes z{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-18px)}}@keyframes fall{0%{transform:translate(0,0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(8px,165px);opacity:0}}@keyframes drift{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}50%{transform:translate(14px,82px) rotate(180deg)}90%{opacity:1}100%{transform:translate(-4px,165px) rotate(360deg);opacity:0}}@keyframes rain{0%{transform:translate(0,0)}100%{transform:translate(-6px,170px)}}@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(6px,-150px);opacity:0}}@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}@keyframes burst{0%{transform:scale(.1);opacity:0}15%{opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.15);opacity:0}}@keyframes heat{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-26px);opacity:0}}@keyframes drip{0%,60%{transform:translateY(0);opacity:0}70%{opacity:1}100%{transform:translateY(14px);opacity:0}}.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 3.5s infinite}.bob .body{animation:bob .9s ea